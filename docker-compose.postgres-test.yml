services:
  postgres-knowledge-test:
    image: ${ERP_AI_PGVECTOR_TEST_IMAGE:-pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic_test_password
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/pgdata
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
