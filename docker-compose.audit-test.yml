services:
  postgres-audit-test:
    image: ${ERP_AI_AUDIT_POSTGRES_IMAGE:-postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic_audit_admin
      POSTGRES_DB: postgres
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
