[project]
name = "erp-ai-platform"
version = "0.1.0"
description = "Entitlement-aware AI platform for modular ERP capabilities"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "markdown-it-py>=4.2.0,<5.0.0",
    "pydantic>=2.12.5,<3",
    "psycopg[pool]>=3.3.4,<3.4",
    "tzdata>=2025.3",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1,<2",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "psycopg-binary>=3.3.4,<3.4",
    "ruff>=0.14.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.28.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_ai"]

[tool.hatch.build.targets.wheel.shared-data]
"docs/contracts/openrouter-agent-model-provider.md" = "share/doc/erp-ai-platform/openrouter-agent-model-provider.md"
"docs/contracts/forced-tool-routing.md" = "share/doc/erp-ai-platform/forced-tool-routing.md"
"docs/contracts/trusted-route-resolution.md" = "share/doc/erp-ai-platform/trusted-route-resolution.md"
"docs/contracts/application-composition.md" = "share/doc/erp-ai-platform/application-composition.md"

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests",
    "/dist",
    "/coverage",
    "/.coverage",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=erp_ai --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
markers = [
    "postgres: requires the explicit ERP_AI_TEST_ADMIN_DSN PostgreSQL service",
    "local_embedding: requires the explicit local TEI service",
    "openrouter: requires an explicit synthetic-only OpenRouter test configuration",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
