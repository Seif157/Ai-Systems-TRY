[project]
name = "erp-ai-platform"
version = "0.1.0"
description = "Entitlement-aware AI platform for modular ERP capabilities"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.12.5,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.14.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.28.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_ai"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=erp_ai --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

